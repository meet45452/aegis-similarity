[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sim"
version = "0.1.0"
description = "AEGIS: Adaptive Ensemble of Geometric, Interaction, and Scaffold similarity - an uncertainty-aware molecular similarity cascade for drug discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AEGIS contributors" }]
keywords = ["cheminformatics", "drug-discovery", "similarity", "scaffold-hopping", "rdkit", "virtual-screening"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Repository = "https://github.com/meet45452/aegis-similarity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"src/aegis/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
